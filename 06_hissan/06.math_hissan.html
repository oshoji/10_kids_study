<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>筆算ドリル</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="./06.math_hissan.css">
</head>
<body class="bg-white p-6 max-w-screen-xl mx-auto">
  <p class="print_none mb-4"><a href="../index.html" class="text-blue-600 underline">← メニューへ</a></p>
  <h1 class="print_none text-3xl font-bold mb-6">筆算ドリル</h1>

  <div id="settings" class="print_none flex flex-wrap items-center gap-x-3 gap-y-2 mb-6 text-sm">
    <label for="operator">演算子:</label>
    <select id="operator" class="border rounded px-1 py-0.5">
      <option value="+">足し算 (+)</option>
      <option value="-">引き算 (-)</option>
      <option value="*">掛け算 (×)</option>
      <option value="/">割り算 (÷)</option>
    </select>

    <label for="count">問題数:</label>
    <input id="count" type="number" min="1" value="8" class="border rounded px-1 py-0.5 w-16" />

    <label for="min">最小値:</label>
    <input id="min" type="number" value="1" class="border rounded px-1 py-0.5 w-20" />
    <label for="max">〜最大値:</label>
    <input id="max" type="number" value="999" class="border rounded px-1 py-0.5 w-20" />

    <label for="digitsA">第1数の桁数:</label>
    <input id="digitsA" type="number" min="1" placeholder="例: 2" class="border rounded px-1 py-0.5 w-16" />

    <label for="digitsB">第2数の桁数:</label>
    <input id="digitsB" type="number" min="1" placeholder="例: 3" class="border rounded px-1 py-0.5 w-16" />

    <button id="generate" class="bg-blue-600 text-white px-3 py-1 rounded shadow">生成</button>
    <button id="check" class="bg-green-600 text-white px-3 py-1 rounded shadow hidden">正誤判定</button>
  </div>

  <!-- 常に4列表示 -->
  <div id="problems" class="problem-grid mt-8"></div>

  <script src='./06.math_hissan.js'></script>
</body>
</html>
