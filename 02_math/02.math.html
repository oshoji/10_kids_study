<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数式問題生成器</title>
    <link rel="stylesheet" href="./02.math.css">
    <script src="../shared/js/jquery-3.7.1.min.js"></script>
    <script src="./02.math.js"></script>

</head>
<body>
    <p class="print_none"><a href="../index.html" class="back-link">← メニューへ</a></p>
    <h1 class="print_none">数式問題生成器</h1>
    <form id="form" class="print_none">
        <label for="min">数値範囲:</label>
        <input type="number" id="min" name="min" required placeholder="min" value="2" class="setting">～
        <input type="number" id="max" name="max" required placeholder="max" value="20" class="setting">&nbsp;&nbsp;

        <label for="count">問題数:</label>
        <input type="number" id="count" name="count" required value="100" class="setting">&nbsp;&nbsp;
        
        <label for="operator">四則演算:</label>
        <select id="operator" name="operator" required>
            <option value="+">たしざん</option>
            <option value="-">ひきざん</option>
            <option value="x1">かけざん</option>
            <option value="x2">かけざん(九九)</option>
            <option value="÷">わりざん</option>
        </select>&nbsp;&nbsp;

        <!-- <label for="min">数値範囲(割り算の前項):</label>
        <input type="number" id="minDiv" name="minDiv" required placeholder="min" value="50" class="setting">～
        <input type="number" id="maxDiv" name="maxDiv" required placeholder="max" value="100" class="setting">&nbsp;&nbsp; -->

        <label for="column">穴埋め:</label>
        <select id="column" name="column" required>
            <option value="A">前項</option>
            <option value="B">中項</option>
            <option value="C" selected>後項</option>
            <option value="ABC">ランダム</option>
        </select>&nbsp;&nbsp;

<button type="button" class="btn btn-primary" onclick="generateProblems()" tabindex="1">生成</button>&nbsp;&nbsp;
<button type="button" class="btn btn-success" onclick="checkAnswers()">正誤判定</button>&nbsp;&nbsp;
    </form>

    <div id="problems"></div>
</body>
<script>generateProblems();</script>

</html>
